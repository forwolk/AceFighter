<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ace Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: 'Russo One', system-ui, sans-serif; color: #cfe7ff;
  }
  #wrap { position: relative; width: 100vw; aspect-ratio: 16 / 9; max-height: 100vh; background: #000; }
  #wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #boot {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; text-align: center; padding: 16px;
  }
  #boot code { background: #111a2b; padding: 4px 8px; border-radius: 4px; color: #ffd36b; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div id="boot">
    <div>LOADING ACE FIGHTER…</div>
    <div style="font-size:13px;opacity:.7">If this never goes away, serve the folder over HTTP:<br><br>
      <code>python3 -m http.server 8000</code> then open <code>http://localhost:8000</code></div>
  </div>
</div>
<script src="src/audio.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
